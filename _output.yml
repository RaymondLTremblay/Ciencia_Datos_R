# El libro se construye SOLO en HTML (gitbook).
#
# El PDF (bookdown::pdf_book) y el ePub (bookdown::epub_book) se quitaron en
# septiembre de 2026: no se usaban y el paso de LaTeX fallaba de forma repetida
# porque Dropbox truncaba los archivos auxiliares mientras xelatex los escribia.
# Ver la seccion correspondiente de CLAUDE.md.
#
# Si algun dia hace falta el PDF: restaurar preamble.tex desde _archivado/ y
# volver a anadir aqui el bloque bookdown::pdf_book, y devolver la linea
# download: ["pdf"] a la configuracion de abajo.

bookdown::gitbook:
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">🌊 Ciencia de Datos con R</a></li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Publicado con bookdown</a></li>
    edit: https://github.com/RaymondLTremblay/Ciencia_Datos_R/edit/main/%s
    sharing:
      github: yes
      facebook: no
      twitter: no
      all: ["facebook", "twitter", "linkedin"]
